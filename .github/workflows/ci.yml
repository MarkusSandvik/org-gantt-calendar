name: CI

on:
  push:
  pull_request:

jobs:
  backend-test:
    name: Backend tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Run migrations against Postgres
        if: matrix.db == 'postgres'
        env:
          APP_DATABASE_URL: postgresql://app:app@localhost:5432/app_test
        run: python -m alembic upgrade head

      - name: Run tests (SQLite)
        if: matrix.db == 'sqlite'
        run: python -m pytest -q

      - name: Run tests (Postgres)
        if: matrix.db == 'postgres'
        env:
          TEST_DATABASE_URL: postgresql://app:app@localhost:5432/app_test
        run: python -m pytest -q

  frontend-build:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
